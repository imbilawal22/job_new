name: Pakistan Job Research & Auto Updater

on:
  schedule:
    # Runs every day at 06:00 UTC (11:00 AM Pakistan Standard Time)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Research Pakistan Jobs via AI & Registry
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/update_jobs.py

      - name: Commit and Push Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/jobs.json js/app.js
          if git diff --staged --quiet; then
            echo "No new job updates to commit."
          else
            git commit -m "Automated Pakistan Job Update [skip ci]"
            git push
          fi
